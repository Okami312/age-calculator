<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Age Calculator</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,700;1,400;1,800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <main class="card">
            <!-- Date inputs -->
            <form class="age-form" id="age-form" novalidate>
                <div class="fields">
                    <div class="field">
                        <label for="day">Day</label>
                        <input
                            type="text"
                            id="day"
                            inputmode="numeric"
                            maxlength="2"
                            placeholder="DD"
                            autocomplete="bday-day"
                        />
                        <p class="error" aria-live="polite"></p>
                    </div>
                    <div class="field">
                        <label for="month">Month</label>
                        <input
                            type="text"
                            id="month"
                            inputmode="numeric"
                            maxlength="2"
                            placeholder="MM"
                            autocomplete="bday-month"
                        />
                        <p class="error" aria-live="polite"></p>
                    </div>
                    <div class="field">
                        <label for="year">Year</label>
                        <input
                            type="text"
                            id="year"
                            inputmode="numeric"
                            maxlength="4"
                            placeholder="YYYY"
                            autocomplete="bday-year"
                        />
                        <p class="error" aria-live="polite"></p>
                    </div>
                </div>

                <!-- Submit button on the divider line -->
                <div class="divider">
                    <button
                        type="submit"
                        class="btn-submit"
                        aria-label="Calculate age"
                    >
                        <picture>
                            <source
                                media="(min-width: 768px)"
                                srcset="./assets/icon-arrow.svg"
                                width="46"
                                height="44"
                            />
                            <img
                                src="./assets/icon-arrow-mobile.svg"
                                alt=""
                                width="24"
                                height="24"
                            />
                        </picture>
                    </button>
                </div>
            </form>

            <!-- Results -->
            <div class="results" aria-live="polite">
                <p>
                    <span class="number" id="result-years">- -</span>
                    <span id="label-years">years</span>
                </p>
                <p>
                    <span class="number" id="result-months">- -</span>
                    <span id="label-months">months</span>
                </p>
                <p>
                    <span class="number" id="result-days">- -</span>
                    <span id="label-days">days</span>
                </p>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
